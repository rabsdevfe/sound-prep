name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      # The adapter tests run the real ffmpeg; they must not be skipped in CI.
      - name: Install ffmpeg
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  desktop:
    name: Desktop (React + Tauri)
    # Tauri builds against the macOS WebView; the app only targets macOS.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      # `bundle.externalBin` needs the frozen sidecar to exist for any Tauri compile step.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      # Rebuilt only when the core sources, its lockfile, Python version or the build script change.
      - name: Restore the core sidecar
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/binaries
          key: sidecar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/uv.lock', 'core/pyproject.toml', 'core/.python-version', 'core/src/**', 'core/packaging/**') }}
      - name: Build the core sidecar
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        working-directory: core
        run: |
          uv sync --locked
          uv run python packaging/build_sidecar.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: IPC contract files are up to date
        run: npm run check:ipc
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Also produces dist/, which the Tauri compile step below requires.
      - run: npm run build
      - name: Rust format
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: Rust lint
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      # `tauri dev` runs the launcher from target/debug; build.rs lays out its code beside it.
      - name: Dev sidecar starts outside a bundle
        working-directory: core
        run: |
          uv sync --locked
          uv run python packaging/smoke_sidecar.py --dev
