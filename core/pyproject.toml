[project]
name = "sound-prep-core"
version = "0.1.0"
description = "Core logic of sound-prep: download, cut and analyze audio clips"
license = "MIT"
authors = [
    { name = "rabsdevfe", email = "222642300+rabsdevfe@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.3",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "packaging"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
